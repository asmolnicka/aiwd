<!DOCTYPE html>
<html lang="pl-PL">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/toc.js' | relative_url }}"></script>
  </head>

  <body>
<header class="page-header" role="banner">
  <h1 class="project-name">{{ site.title }}</h1>
  <h2 class="project-tagline">{{ site.description }}</h2>

  {% if site.github.is_project_page %}
    <a href="{{ site.github.repository_url }}" class="btn">GitHub</a>
  {% endif %}
</header>

    <div class="layout-with-toc">
      <nav class="toc-nav" aria-label="Spis treści">
        <strong>Spis treści</strong>
        <ul id="toc"></ul>
      </nav>

      <main id="content" class="main-content" role="main">
        {{ content }}
      </main>
    </div>
  </body>
</html>
